[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-agent"
version = "0.1.0"
description = "SR-Agent: local-first ingestion pipeline for scientific documents (fetch, dedup, score, parse, human QC, Notion publish)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "tenacity>=8.3",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "notion-client>=2.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.2", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["sr_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
