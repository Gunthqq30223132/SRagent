name: Test Suite & Verification Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,dev]"

      - name: Run Pytest
        run: |
          python -m pytest

      - name: Run M6 Gate Verification
        run: |
          bash scripts/gate_m6.sh

      - name: Run D32 Gate Verification
        run: |
          bash scripts/gate_d32.sh
