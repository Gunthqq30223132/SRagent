# AnesthOS Gates Configuration (Project-Agnostic Manifest)
project: "AnesthOS"
version: "1.0.0"

# Mapped verification commands
quality_gates:
  secret_scan: "python3 scripts/scan-history-secrets.py"
  lint_boundary: "bash scripts/gate_m6.sh"
  test_suite: "python3 -m pytest"
  compliance_check: "bash scripts/gate_d32.sh"
  dispatch_provenance: "python3 -c \"from sr_agent.store.dispatch_verifier import verify_dispatch_receipt as v; import os, glob; tasks = [os.path.basename(p)[:-3] for p in glob.glob('.agents/dispatch/*.md')]; ok, m = (v(tasks[0], '.') if tasks else (True, 'SKIP: no dispatch tasks')); print(m); import sys; sys.exit(0 if ok else 1)\""


# Numeric Firewall gate for clinical mathematical calculations
# $Dose = C \times Weight$
clinical_firewall: "python3 -m pytest tests/test_guards.py"
